<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live buses · Ghost Bus Detector</title>
<link rel="preload" href="fonts/atkinson-hyperlegible-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; src: url("fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; src: url("fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); }
:root { --bg: #fff; --ink: #0E1726; --muted: #5B6676; --rule: #E1E6ED; --brand: #5B3FC4; --live: #0E9F6E; --late: #C97400; --g: #5B3FC4; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0F151D; --ink: #E8EDF3; --muted: #9AA6B5; --rule: #1F2A36; --brand: #A48BFF; --live: #2BC48A; --late: #F0A33A; --g: #A48BFF; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.4 "Atkinson Hyperlegible", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.w { padding: 14px 16px 10px; }
h1 { margin: 0; font-size: 1.15rem; line-height: 1.2; }
.sub { color: var(--muted); font-size: .8rem; margin: 2px 0 10px; display: flex; gap: 6px; align-items: center; }
.sub i { width: 8px; height: 8px; border-radius: 50%; background: var(--live); display: inline-block; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); }
.rt { min-width: 2.6em; text-align: center; padding: 2px 6px; border-radius: 6px; background: var(--ink); color: var(--bg); font-weight: 700; }
.to { min-width: 0; }
.to b { display: block; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.to small { color: var(--muted); }
.due { text-align: right; font-weight: 700; font-size: 1.05rem; }
.due small { display: block; font-weight: 400; font-size: .72rem; color: var(--muted); }
.ok { color: var(--live); } .late { color: var(--late); } .g { color: var(--g); }
.foot { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--rule); padding-top: 8px; margin-top: 2px; font-size: .75rem; color: var(--muted); }
.foot a { color: var(--brand); font-weight: 700; text-decoration: none; }
.none { color: var(--muted); padding: 12px 0; }
</style>
</head>
<body>
<div class="w" id="w"><p class="none">Loading live buses…</p></div>
<script src="js/embed.js?v=17" type="module"></script>
</body>
</html>
