<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ghost Bus Detector – Sheffield</title>
  <meta name="description" content="Live bus times for every stop in Sheffield, checked against the buses’ own GPS: where your bus is, how late it’s running, and which buses never turned up.">
  <meta name="theme-color" content="#0E1726">
  <meta property="og:title" content="Ghost Bus Detector – Sheffield">
  <meta property="og:description" content="Live bus times for every stop in Sheffield, checked against GPS, and the buses that never came.">
  <meta property="og:image" content="https://mohammed-890.github.io/ghost-bus/social.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1726'/%3E%3Crect x='14' y='14' width='36' height='32' rx='6' fill='none' stroke='%23A48BFF' stroke-width='5' stroke-dasharray='7 5'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/atkinson-hyperlegible-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css?v=7">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="app">
    <aside class="panel" id="main" tabindex="-1">
      <header class="top">
        <a class="brand" href="#/"><span class="mark" aria-hidden="true"></span><span>Ghost Bus<small>Sheffield</small></span></a>
        <span class="fresh" id="fresh"><i aria-hidden="true"></i><span>Live · </span><b id="fresh-age">connecting…</b></span>
      </header>
      <nav class="nav" aria-label="Sections">
        <a href="#/" data-v="home">Live</a>
        <a href="#/network" data-v="network">Network</a>
        <a href="#/reliability" data-v="reliability">Reliability</a>
        <a href="#/about" data-v="about">How it works</a>
      </nav>
      <div class="search" role="search">
        <label class="vh" for="q">Search for a stop or route</label>
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search a stop or route number"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="q-list">
          <kbd aria-hidden="true">/</kbd>
          <ul id="q-list" class="q-list" role="listbox" hidden></ul>
        </div>
        <button type="button" class="near" id="near">Near me</button>
      </div>
      <div class="view" id="view" aria-live="polite"><p class="muted loading">Loading Sheffield’s buses…</p></div>
      <footer class="foot">
        Built by <a href="https://www.linkedin.com/in/mohammed-banabilh-6340553b0/">Mohammed Banabilh</a> ·
        <a href="https://github.com/Mohammed-890/ghost-bus">Code</a> ·
        Bus Open Data Service, Open Government Licence v3.0
      </footer>
    </aside>
    <main class="mapwrap" aria-label="Live map">
      <div id="map" role="img" aria-label="Map of Sheffield with every bus on the road, coloured by how late it is"></div>
    </main>
  </div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/main.js?v=7" type="module"></script>
</body>
</html>
