# Records live bus positions for Sheffield, back to back, around the clock.
# Each run polls for 55 minutes and queues the next run as soon as it starts,
# so collection is continuous (GitHub runs frequent schedules only every few
# hours, so the schedule is just a backup that restarts the chain). Every poll
# (and every failure) is saved, so gaps are known and never counted as ghosts.
name: collect
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check the API key is set
        id: key
        run: |
          if [ -z "${{ secrets.BODS_API_KEY }}" ]; then
            echo "::notice::Add the BODS_API_KEY secret to start collecting (see README)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Queue the next run (it starts when this one finishes)
        if: steps.key.outputs.ok == 'true'
        run: gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.key.outputs.ok == 'true'
        run: pip install -q -r requirements.txt
      - name: Poll the live feed, saving and updating the website every 13 minutes
        if: steps.key.outputs.ok == 'true'
        run: |
          git config --global user.name "ghost-bus-bot"
          git config --global user.email "actions@users.noreply.github.com"
          # The previous run may have pushed seconds before this checkout; start from the latest.
          git pull -q --rebase || true
          (cd store && git pull -q --rebase || true)
          save_store() {  # pings: never thrown away; if a push can't go through, it's retried next round
            git add -A && git commit -qm "pings $(date -u +%Y-%m-%dT%H:%MZ)" || true
            for i in 1 2 3; do
              if git pull -q --rebase; then git push -q && return 0; else git rebase --abort 2>/dev/null; fi
              sleep $((i*5))
            done
            echo "::warning::store push postponed to the next round"
          }
          publish_site() {  # live status: rebuilt on top of the latest main every time, so it can't conflict
            for i in 1 2 3; do
              git fetch -q origin main && git reset -q --hard origin/main
              python -m ghostbus.publish --health || { echo "::warning::live status not refreshed"; return 0; }
              git add -A docs/data
              git commit -qm "live status $(date -u +%Y-%m-%dT%H:%MZ)" || return 0
              git push -q && return 0
              sleep $((i*5))
            done
            echo "::warning::live status push skipped this round"
          }
          for round in 1 2 3 4; do
            python -m ghostbus.collect --minutes 13 || echo "::warning::collector round $round stopped early"
            (cd store && save_store)
            publish_site
          done
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          GHOSTBUS_DATA: store
