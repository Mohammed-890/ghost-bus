# Once a day: refresh the timetable (weekly), judge every finished day,
# retrain and re-test the model, and publish the website data.
name: daily
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
concurrency:
  group: daily
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m ghostbus.daily
        env:
          GHOSTBUS_DATA: store
      - name: Save results
        working-directory: store
        run: |
          git config user.name "ghost-bus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "results $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*5)); done
          exit 1
      - name: Publish site data
        run: |
          git config user.name "ghost-bus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git commit -qm "site data $(date -u +%Y-%m-%d)" || exit 0
          git pull -q --rebase && git push -q
