apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gb.fullname" . }}-api
  labels: {{- include "gb.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {{- include "gb.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels: {{- include "gb.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          {{- include "gb.common" . | nindent 10 }}
          command: ["uvicorn", "ghostbus.serve:app", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}"]
          ports:
            - {name: http, containerPort: {{ .Values.api.port }}}
          # Alive = the process answers. Ready = a champion model is loaded.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 40
          lifecycle:
            # Let the Service stop routing here before the process exits.
            preStop:
              exec: {command: ["python", "-c", "import time; time.sleep(5)"]}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gb.fullname" . }}-api
  labels: {{- include "gb.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: {{- include "gb.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gb.fullname" . }}-api
  labels: {{- include "gb.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "gb.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
