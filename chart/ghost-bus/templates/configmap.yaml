apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gb.fullname" . }}-config
  labels: {{- include "gb.labels" . | nindent 4 }}
data:
  GHOSTBUS_DATA: /data
  GHOSTBUS_SITE: /tmp/site
  HOME: /tmp
  MODEL_REFRESH_SECONDS: {{ .Values.api.modelRefreshSeconds | quote }}
  MLFLOW_DISABLE_AGENT_HINT: "1"
  {{- if .Values.mlflow.enabled }}
  MLFLOW_TRACKING_URI: http://{{ include "gb.mlflowHost" . }}:{{ .Values.mlflow.port }}
  {{- end }}
  {{- if .Values.pushgateway.enabled }}
  PUSHGATEWAY_URL: http://{{ include "gb.fullname" . }}-pushgateway:9091
  {{- end }}
