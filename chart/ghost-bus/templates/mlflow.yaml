{{- if .Values.mlflow.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gb.mlflowHost" . }}
  labels: {{- include "gb.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.data.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.mlflow.storage }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gb.mlflowHost" . }}
  labels: {{- include "gb.labels" . | nindent 4 }}
    app.kubernetes.io/component: mlflow
spec:
  replicas: 1
  strategy: {type: Recreate}   # SQLite: one server at a time
  selector:
    matchLabels: {{- include "gb.selector" . | nindent 6 }}
      app.kubernetes.io/component: mlflow
  template:
    metadata:
      labels: {{- include "gb.selector" . | nindent 8 }}
        app.kubernetes.io/component: mlflow
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mlflow
          image: {{ include "gb.mlflowImage" . }}
          imagePullPolicy: {{ .Values.mlflowImage.pullPolicy }}
          args: ["--allowed-hosts", "{{ include "gb.mlflowHost" . }}:{{ .Values.mlflow.port }},{{ include "gb.mlflowHost" . }},localhost:{{ .Values.mlflow.port }},127.0.0.1:{{ .Values.mlflow.port }}"]
          ports:
            - {name: http, containerPort: 5000}
          env:
            - {name: HOME, value: /tmp}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.mlflow.resources | nindent 12 }}
          volumeMounts:
            - {name: store, mountPath: /mlflow}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: store
          persistentVolumeClaim: {claimName: {{ include "gb.mlflowHost" . }}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gb.mlflowHost" . }}
  labels: {{- include "gb.labels" . | nindent 4 }}
    app.kubernetes.io/component: mlflow
spec:
  selector: {{- include "gb.selector" . | nindent 4 }}
    app.kubernetes.io/component: mlflow
  ports:
    - {name: http, port: {{ .Values.mlflow.port }}, targetPort: http}
{{- end }}
